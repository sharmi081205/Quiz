<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz - Final Working</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&display=swap');
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:#080b18;color:#fff}
.screen{display:none;min-height:100vh;padding:20px}.screen.active{display:flex!important;align-items:center;justify-content:center}
.wrap{width:min(1100px,96%);background:#ffffff0d;border:1px solid #ffffff1c;border-radius:30px;padding:38px;text-align:center}
.badge{display:inline-block;padding:8px 15px;border-radius:30px;background:#ffffff12;border:1px solid #ffffff20;color:#b8c4ff;font-size:12px;letter-spacing:2px;font-weight:800}
.college-title{font-family:"Playfair Display",serif;font-size:clamp(18px,2.8vw,30px);line-height:1.15;margin:18px auto 6px;font-weight:800;background:linear-gradient(90deg,#fff,#a9b7ff,#67e8f9);-webkit-background-clip:text;color:transparent}
.college-title span{display:block;font-size:.85em;letter-spacing:2px;margin-top:6px;background:linear-gradient(90deg,#a9b7ff,#67e8f9);-webkit-background-clip:text;color:transparent}
.main-title{font-family:"Playfair Display",serif;font-size:clamp(24px,4vw,38px);margin:14px 0 8px;background:linear-gradient(90deg,#fff,#a9b7ff,#67e8f9);-webkit-background-clip:text;color:transparent}
.lead{color:#aab3cc}.topics{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:30px 0}
.topic{border:1px solid #ffffff1b;border-radius:24px;padding:30px 26px;text-align:left;background:linear-gradient(145deg,#ffffff12,#ffffff05);cursor:pointer;color:#fff;min-height:280px;display:flex;flex-direction:column;justify-content:space-between;width:100%}
.tree-icon{font-size:72px}.count{padding:9px 14px;border-radius:20px;background:#ffffff10;color:#c8d1ff;font-size:12px;font-weight:700;display:inline-block;margin-top:18px}
.full{width:100%;padding:16px;border:0;border-radius:14px;background:linear-gradient(90deg,#5b4bff,#00b8d9);color:white;font-size:17px;font-weight:800;cursor:pointer;margin-top:10px}
input{width:100%;padding:15px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff0d;color:#fff;font-size:16px;margin-bottom:18px}
</style>
</head>
<body>

<div id="login" class="screen active">
<div class="wrap" style="max-width:650px">
<span class="badge">STUDENT LOGIN</span>
<h1 class="main-title" style="font-size:32px">Welcome to the Quiz</h1>
<p class="lead">Enter your details to start the Quiz</p>
<div style="text-align:left;margin-top:28px">
<input id="studentName" placeholder="Enter your name">
<input id="studentRoll" placeholder="Eg: 26PCA124">
<!-- INLINE ONCLICK - 100% WORK -->
<button class="full" type="button" onclick="goToHome()">Continue to Quiz →</button>
</div>
</div>
</div>

<div id="home" class="screen">
<div class="wrap">
<span class="badge">DEPARTMENT OF COMPUTER APPLICATIONS</span>
<div class="college-title">AYYA NADAR JANAKI AMMAL COLLEGE<span>(AUTONOMOUS), SIVAKASI</span></div>
<h1 class="main-title">Mathematical<br>Foundation</h1>
<p class="lead">The Grand Interactive Quiz Experience</p>
<div style="margin:20px auto;padding:18px;max-width:650px;border-radius:18px;background:#0003;border:1px solid #ffffff12"><b>DESIGNED BY</b><br>Sharmila M • 26PCA124</div>
<div class="topics">
<!-- INLINE ONCLICK - NO EVENT LISTENER NEEDED -->
<button class="topic" type="button" onclick="startQuiz('Trees')"><div class="tree-icon">🌳</div><div><h2>Trees</h2><p style="color:#aeb7d0">Analyze BSTs, AVL, heaps</p></div><span class="count">20 QUESTIONS</span></button>
<button class="topic" type="button" onclick="startQuiz('Boolean Algebra')"><div style="font-size:40px">0 1<br>1 0</div><div><h2>Boolean<br>Algebra</h2><p style="color:#aeb7d0">Boolean, K-maps, gates</p></div><span class="count">20 QUESTIONS</span></button>
</div>
<button class="full" type="button" onclick="startQuiz('All')">🚀 START GRAND QUIZ • 40 QUESTIONS</button>
</div>
</div>

<div id="quiz" class="screen"><div class="wrap" style="width:min(950px,96%)"><div style="display:flex;justify-content:space-between"><span class="badge" id="topicName"></span><span class="badge" id="counter"></span></div><div style="height:9px;background:#ffffff10;border-radius:20px;margin:18px 0"><div id="bar" style="height:100%;width:0;background:linear-gradient(90deg,#6857ff,#4de4ff)"></div></div><div id="question" style="font-size:24px;margin:12px 0 24px;text-align:left"></div><div id="options" style="display:grid;gap:12px"></div><div style="display:flex;gap:12px;margin-top:20px"><button class="full" style="background:#ffffff10" type="button" onclick="prevQ()">← Previous</button><button class="full" type="button" onclick="nextQ()">Next →</button></div></div></div>
<div id="result" class="screen"><div class="wrap"><h2 id="resTitle"></h2><div id="score" style="font-size:50px;font-weight:800"></div><p id="msg"></p><button class="full" type="button" onclick="location.reload()">⌂ Home</button><div id="review" style="text-align:left;margin-top:20px;max-height:300px;overflow:auto"></div></div></div>

<script>
function goToHome(){
  var n=document.getElementById('studentName').value.trim();
  var r=document.getElementById('studentRoll').value.trim();
  if(!n ||!r){ alert('Name & Roll type pannu da!'); return; }
  document.getElementById('login').classList.remove('active');
  document.getElementById('home').classList.add('active');
  console.log('Home opened');
}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

const TREES=[
["A full binary tree contains 15 internal vertices. Leaves and total?","16, 31","15, 31","16, 30","15, 30"],
["Ordered tree root A children B,C,D; B children E,F; D child G. Preorder?","A B E F C D G","E F B C G D A","A C B E F D G","A B C D E F G"],
["Root has 4 children, one level-1 has 4 children. Max children?","4","3","5","8"],
["12 vertices 11 edges - true?","The graph is a tree","One cycle","Disconnected","Degree 2"],
["Insert 50,30,70,20,40,60,80,35. Predecessor of 40?","35","20","30","50"],
["Decreasing order BST height n nodes?","n - 1","log2 n","n","n + 1"],
["Delete node with two children BST?","Its inorder successor or predecessor","Any leaf","Root","Highest degree"],
["Sort 5 elements worst-case decision tree min height?","7","3","4","5"],
["Decision tree height h sorts n elements?","2^h ≥ n!","h ≥ 2^n","2^n ≥ h!","h = n!"],
["Huffman A=5 B=9 C=12 D=13 E=16 weighted path?","124","125","135","145"],
["Huffman optimal property?","Two least frequent can be siblings at max depth","All equal","Most frequent 111","Complete"],
["Code {0,10,110,111}?","It is prefix-free and uniquely decodable","Not prefix-free","Not uniquely decodable","Fixed-length"],
["Nim 3,4,5?","Winning because Nim-sum nonzero","Losing Nim-sum 0","Losing because differ","Second player"],
["Nim (7,4,2) zero move?","Remove 1 from 7","Remove 3 from 7","Remove 1 from 4","Remove 2 from 2"],
["Inorder D B E A F C Preorder A B D E C F Postorder?","D E B F C A","D B E F C A","E D B C F A","B D E A C F"],
["Full 3-ary 10 internal total vertices?","31","21","30","33"],
["Max vertices binary tree height 4 root 0?","31","15","16","32"],
["Directory tree property?","Each non-root has exactly one parent","Degree 2","Same depth","Binary"],
["Decision tree 720 leaves min height?","10","8","9","720"],
["Source A=0.5 B=0.25 C=0.125 D=0.125 avg length?","1.75 bits","1.25","1.50","2.00"]
];
const BOOLEAN=[
["Simplify A + A'B.","A + B","A","B","AB"],
["Simplify (A+B)(A+C).","A + BC","AB+AC","A(B+C)","A+B+C"],
["Complement of AB+C.","(A' + B')C'","(A+B)C","A'B' + C'","AB + C'"],
["Dual of A+0=A?","A·1=A","A+1=1","A·0=0","A+A=A"],
["A+B'C SOP?","Σm(1,4,5,6,7)","Σm(2,3,4,5,6,7)","Σm(1,2,3,4,5,7)","Σm(0-7)"],
["F=Σm(1,3,5,7) POS?","ΠM(0,2,4,6)","ΠM(1,3,5,7)","ΠM(0,1,2,3)","ΠM(2,4,6,7)"],
["m5(A,B,C)?","AB'C","A'BC","ABC'","A'B'C"],
["AND using only NAND?","(A NAND B) NAND (A NAND B)","A NAND B","(A NAND A) NAND B","A NAND (B NAND B)"],
["NOT using NOR?","A NOR A","A NOR 0","A NOR 1","A NOR (A+A)"],
["4-var K-map group of 8 eliminates?","3","1","2","4"],
["K-map adjacency?","Edge cells can be adjacent through wraparound","Only horizontal","Only vertical","Diagonal"],
["Simplify Σm(1,3,5,7).","C","A","B","A+B"],
["Don't-care use?","May be 0 or 1 for simpler","Must be 0","Must be 1","Removed"],
["BCD unused 10-15?","Don't-care if never occur","Must be 1","Errors","Must be 0"],
["Quine combine when?","Differ in exactly one bit","Differ in every bit","Same 1s only","Different vars"],
["Essential prime implicant?","Covers minterm not covered by others","Covers none","Contains every var","Most literals"],
["Consensus AB+A'C+BC?","AB+A'C","AB+A'C+BC","AC+BC","A+B+C"],
["OR using only NAND?","(A NAND A) NAND (B NAND B)","A NAND B","(A NAND B) NAND A","A NAND (B NAND B)"],
["Distinct Boolean functions 4 vars?","65,536","16","64","256"],
["Implicant cannot combine?","Prime implicant","Minterm","Maxterm","Consensus"]
];

let qs=[],ans=[],qi=0,cur='';
function startQuiz(t){
  cur=t;
  if(t==='Trees') qs=TREES;
  else if(t==='Boolean Algebra') qs=BOOLEAN;
  else qs=[...TREES,...BOOLEAN];
  ans=Array(qs.length).fill(null); qi=0;
  showScreen('quiz'); render();
  console.log('Quiz started',t,qs.length);
}
function render(){
  document.getElementById('topicName').textContent=cur+' - '+qs.length+' Q';
  document.getElementById('counter').textContent=(qi+1)+'/'+qs.length;
  document.getElementById('bar').style.width=((qi+1)/qs.length*100)+'%';
  document.getElementById('question').textContent=(qi+1)+'. '+qs[qi][0];
  let o=document.getElementById('options'); o.innerHTML='';
  qs[qi].slice(1).forEach((x,k)=>{
    let b=document.createElement('button');
    b.style.cssText='border:1px solid #ffffff18;background:#ffffff09;color:#eef2ff;border-radius:12px;padding:14px;text-align:left;cursor:pointer';
    if(ans[qi]===x) b.style.background='#5965ff33';
    b.textContent=String.fromCharCode(65+k)+'. '+x;
    b.onclick=function(){ans[qi]=x; render();};
    o.appendChild(b);
  });
}
function nextQ(){ if(!ans[qi]){alert('Answer select pannu da!');return;} if(qi<qs.length-1){qi++;render();} else finishQ(); }
function prevQ(){ if(qi>0){qi--;render();} }
function finishQ(){
  let c=qs.filter((q,i)=>ans[i]===q[1]).length;
  document.getElementById('resTitle').textContent=cur+' Completed';
  document.getElementById('score').textContent=c+' / '+qs.length;
  document.getElementById('msg').textContent='Score: '+Math.round(c/qs.length*100)+'%';
  let r=document.getElementById('review'); r.innerHTML='';
  qs.forEach((q,i)=>{ r.innerHTML+='<div style="padding:8px;border-bottom:1px solid #ffffff12">Q'+(i+1)+': '+q[0]+'<br>Your: '+(ans[i]||'Not answered')+' | Correct: '+q[1]+'</div>'; });
  showScreen('result');
}
</script>
</body>
</html>
