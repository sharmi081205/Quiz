<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trees & Boolean Algebra | Grand Quiz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap');
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#080b18;color:#fff;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 15% 20%,#5546ff55,transparent 28%),radial-gradient(circle at 85% 75%,#00d4ff33,transparent 30%),linear-gradient(135deg,#080b18,#111632);z-index:-2}
.screen{display:none;min-height:100vh;padding:20px}.screen.active{display:flex!important;align-items:center;justify-content:center}
.wrap{width:min(1100px,96%);background:#ffffff0d;border:1px solid #ffffff1c;border-radius:30px;backdrop-filter:blur(18px);box-shadow:0 30px 80px #0008;padding:38px}
.brand{text-align:center}.badge{display:inline-block;padding:8px 15px;border-radius:30px;background:#ffffff12;border:1px solid #ffffff20;color:#b8c4ff;font-size:12px;letter-spacing:2px;font-weight:800}
.college-title{font-family:"Playfair Display",serif;font-size:20px;margin:18px auto 4px;background:linear-gradient(90deg,#fff,#a9b7ff,#67e8f9);-webkit-background-clip:text;color:transparent;font-weight:800;text-align:center;white-space:nowrap}
.college-title span{font-family:Inter,sans-serif;font-size:.9em;margin-left:6px;background:linear-gradient(90deg,#a9b7ff,#67e8f9);-webkit-background-clip:text;color:transparent}
h1.main-title{font-family:"Playfair Display",serif;font-size:22px;margin:12px 0 8px;background:linear-gradient(90deg,#fff,#a9b7ff,#67e8f9);-webkit-background-clip:text;color:transparent}
.lead{color:#aab3cc}.creator{margin:20px auto;padding:18px;max-width:650px;border-radius:18px;background:#0003;border:1px solid #ffffff12;color:#dbe3ff}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:30px 0}.topic{border:1px solid #ffffff1b;border-radius:24px;padding:30px;text-align:left;background:linear-gradient(145deg,#ffffff12,#ffffff05);cursor:pointer;color:#fff}
.tree-big{font-size:85px!important;display:block}
.full{width:100%;padding:16px;border:0;border-radius:14px;background:linear-gradient(90deg,#5b4bff,#00b8d9);color:white;font-size:17px;font-weight:800;cursor:pointer}
@media(max-width:700px){.college-title{font-size:11px!important;white-space:nowrap}.tree-big{font-size:65px!important}}
.qhead{display:flex;justify-content:space-between}.pill{padding:8px 13px;background:#ffffff10;border-radius:20px}.progress{height:9px;background:#ffffff10;border-radius:20px;margin:18px 0 28px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6857ff,#4de4ff);transition:.3s}
.question{font-size:27px;margin:12px 0 24px}.options{display:grid;gap:14px}.opt{border:1px solid #ffffff18;background:#ffffff09;color:#eef2ff;border-radius:16px;padding:18px;text-align:left;cursor:pointer}.opt.selected{background:#5965ff33;border-color:#91a0ff}.letter{display:inline-flex;width:32px;height:32px;border-radius:10px;align-items:center;justify-content:center;background:#ffffff12;margin-right:10px;font-weight:800}
.actions{display:flex;justify-content:space-between;margin-top:28px}.btn{padding:13px 20px;border-radius:12px;border:1px solid #ffffff18;background:#ffffff0d;color:#fff;cursor:pointer}.btn.primary{background:linear-gradient(90deg,#5b4bff,#00a9cf);border:0;font-weight:800}
</style>
</head>
<body>

<!-- LOGIN - FIRST PAGE -->
<div id="login" class="screen active">
<div class="wrap brand" style="max-width:650px">
<span class="badge">STUDENT LOGIN</span>
<h1 class="main-title" style="font-size:32px">Welcome to the Quiz</h1>
<p class="lead">Enter your details to start</p>
<div style="text-align:left;margin-top:28px">
<label style="display:block;margin-bottom:8px;font-weight:700">Student Name</label>
<input id="studentName" type="text" placeholder="Enter your name" style="width:100%;padding:15px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff0d;color:#fff;font-size:16px;margin-bottom:18px">
<label style="display:block;margin-bottom:8px;font-weight:700">Register Number</label>
<input id="studentRoll" type="text" placeholder="Eg: 26PCA124" style="width:100%;padding:15px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff0d;color:#fff;font-size:16px;margin-bottom:22px">
<button type="button" class="full" onclick="goHome()">Continue to Quiz →</button>
</div>
</div>
</div>

<!-- HOME PAGE - SCREENSHOT LA IRUKURA MATHIRI -->
<div id="home" class="screen">
<div class="wrap brand">
<span class="badge">DEPARTMENT OF COMPUTER APPLICATIONS</span>
<div class="college-title">AYYA NADAR JANAKI AMMAL COLLEGE <span>(AUTONOMOUS), SIVAKASI</span></div>
<h1 class="main-title">Mathematical Foundation</h1>
<p class="lead">The Grand Interactive Quiz Experience</p>
<div class="creator"><b>DESIGNED BY</b><br>Sharmila M • 26PCA124<br>MCA • Advanced MCQ Practice</div>
<div class="topics">
<button class="topic" onclick="start('Trees')"><div class="tree-big">🌳</div><h2>Trees</h2><p>Analyze BSTs, AVL rotations, heaps</p><span style="display:inline-block;margin-top:10px;padding:7px 11px;border-radius:20px;background:#ffffff10;font-size:12px">20 QUESTIONS</span></button>
<button class="topic" onclick="start('Boolean Algebra')"><div style="width:52px;height:52px;display:grid;grid-template-columns:1fr 1fr;gap:5px"><div style="background:#5b5bff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900">0</div><div style="background:#7b61ff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900">1</div><div style="background:#7b61ff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900">1</div><div style="background:#5b5bff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900">0</div></div><h2>Boolean Algebra</h2><p>Boolean identities, De Morgan, K-maps</p><span style="display:inline-block;margin-top:10px;padding:7px 11px;border-radius:20px;background:#ffffff10;font-size:12px">20 QUESTIONS</span></button>
</div>
<button class="full" onclick="start('All')">🚀 START GRAND QUIZ • 40 QUESTIONS</button>
</div>
</div>

<div id="quiz" class="screen"><div class="wrap" style="width:min(950px,96%)"><div class="qhead"><div><span class="badge" id="topic"></span><div id="counter"></div></div><span class="pill" id="answered"></span></div><div class="progress"><i id="bar"></i></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="actions"><button class="btn" onclick="prev()">← Previous</button><button class="btn primary" onclick="next()">Next →</button></div></div></div>

<div id="result" class="screen"><div class="wrap" style="text-align:center"><h2 id="resTitle"></h2><div id="score" style="font-size:60px;font-weight:800"></div><p id="msg"></p><div class="actions"><button class="btn" onclick="location.reload()">⌂ Home</button><button class="btn primary" onclick="restart()">↻ Try Again</button></div><div id="review" style="text-align:left;margin-top:20px;max-height:300px;overflow:auto"></div></div></div>

<script>
function goHome(){
  var n=document.getElementById('studentName').value.trim();
  var r=document.getElementById('studentRoll').value.trim();
  if(n==="" || r===""){alert("Please enter Name & Roll No da!");return;}
  document.getElementById('login').classList.remove('active');
  document.getElementById('home').classList.add('active');
}
const T=[["A full binary tree contains 15 internal vertices. What is the number of leaves?","16, 31","15, 31","16, 30","15, 30"],["Preorder of tree A(B(E,F),C,D(G))?","A B E F C D G","E F B C G D A","A C B E F D G","A B C D E F G"],["Max children?","4","3","5","8"],["12 vertices 11 edges?","The graph is a tree","One cycle","Disconnected","Degree 2"],["Inorder predecessor of 40?","35","20","30","50"],["Decreasing order BST height?","n - 1","log₂ n","n","n + 1"],["Delete node with 2 children?","Its inorder successor or predecessor","Any leaf","Root","Highest degree"],["Min height for 5 elements sorting?","7","3","4","5"],["Decision tree h vs n?","2^h ≥ n!","h ≥ 2^n","2^n ≥ h!","h = n!"],["Huffman length?","124","125","135","145"],["Huffman optimal property?","Two least frequent can be siblings at max depth","All equal","Most frequent 111","Complete"],["Code {0,10,110,111}?","It is prefix-free and uniquely decodable","Not prefix-free","Not uniquely decodable","Fixed-length"],["Nim 3,4,5?","Winning because Nim-sum nonzero","Losing","Losing because differ","Second player"],["Nim (7,4,2) zero?","Remove 1 from 7","Remove 3 from 7","Remove 1 from 4","Remove 2 from 2"],["Inorder D B E A F C Preorder A B D E C F Postorder?","D E B F C A","D B E F C A","E D B C F A","B D E A C F"],["Full 3-ary 10 internal?","31","21","30","33"],["Max vertices height 4?","31","15","16","32"],["Directory tree property?","Each non-root has exactly one parent","Degree 2","Same depth","Binary"],["Decision tree 720 leaves min height?","10","8","9","720"],["Source A=0.5 B=0.25 C=0.125 D=0.125 avg length?","1.75 bits","1.25","1.50","2.00"]];
const B=[["Simplify A + A'B.","A + B","A","B","AB"],["Simplify (A+B)(A+C).","A + BC","AB+AC","A(B+C)","A+B+C"],["Complement of AB+C.","(A'+B')C'","(A+B)C","A'B'+C'","AB+C'"],["Dual of A+0=A?","A·1=A","A+1=1","A·0=0","A+A=A"],["A+B'C SOP?","Σm(1,4,5,6,7)","Σm(2,3,4,5,6,7)","Σm(1,2,3,4,5,7)","Σm(0-7)"],["F=Σm(1,3,5,7) POS?","ΠM(0,2,4,6)","ΠM(1,3,5,7)","ΠM(0,1,2,3)","ΠM(2,4,6,7)"],["m5(A,B,C)?","AB'C","A'BC","ABC'","A'B'C"],["AND using NAND?","(A NAND B) NAND (A NAND B)","A NAND B","(A NAND A) NAND B","A NAND (B NAND B)"],["NOT using NOR?","A NOR A","A NOR 0","A NOR 1","A NOR (A+A)"],["4-var K-map group of 8 eliminates?","3","1","2","4"],["K-map adjacency?","Edge cells can be adjacent through wraparound","Only horizontal","Only vertical","Diagonal"],["Simplify Σm(1,3,5,7).","C","A","B","A+B"],["Don't-care use?","May be 0 or 1 for simpler","Must be 0","Must be 1","Removed"],["BCD unused 10-15?","Don't-care if never occur","Must be 1","Errors","Must be 0"],["Quine-McCluskey combine when?","Differ in exactly one bit","Differ in every bit","Same 1s only","Different vars"],["Essential prime implicant?","Covers minterm not covered by others","Covers none","Contains every var","Most literals"],["Consensus AB+A'C+BC?","AB+A'C","AB+A'C+BC","AC+BC","A+B+C"],["OR using NAND?","(A NAND A) NAND (B NAND B)","A NAND B","(A NAND B) NAND A","A NAND (B NAND B)"],["Distinct Boolean functions 4 vars?","65,536","16","64","256"],["Implicant cannot combine?","Prime implicant","Minterm","Maxterm","Consensus"]];
let qs=[],ans=[],i=0,currentTopic="";
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');}
function start(t){currentTopic=t;qs=t==='Trees'?T:t==='Boolean Algebra'?B:[...T,...B];ans=Array(qs.length).fill(null);i=0;show('quiz');render();}
function render(){document.getElementById('topic').textContent=currentTopic==='All'?'GRAND QUIZ':currentTopic.toUpperCase();document.getElementById('counter').textContent=`QUESTION ${i+1} OF ${qs.length}`;document.getElementById('answered').textContent=ans.filter(Boolean).length+' answered';document.getElementById('bar').style.width=((i+1)/qs.length*100)+'%';document.getElementById('question').textContent=qs[i][0];let o=document.getElementById('options');o.innerHTML='';qs[i].slice(1).forEach((x,k)=>{let b=document.createElement('button');b.className='opt'+(ans[i]===x?' selected':'');b.innerHTML=`<span class="letter">${String.fromCharCode(65+k)}</span>${x}`;b.onclick=()=>{ans[i]=x;render();};o.appendChild(b);});}
function next(){if(!ans[i]){alert('Please select answer');return;}if(i<qs.length-1){i++;render();}else finish();}
function prev(){if(i>0){i--;render();}}
function finish(){let c=qs.filter((q,n)=>ans[n]===q[1]).length;document.getElementById('resTitle').textContent=currentTopic;document.getElementById('score').textContent=`${c} / ${qs.length}`;document.getElementById('msg').textContent=c>qs.length/2?'Excellent!':'Keep practising';let r=document.getElementById('review');r.innerHTML='';qs.forEach((q,n)=>{r.innerHTML+=`<div style="padding:10px;border-bottom:1px solid #ffffff10">Q${n+1}. ${q[0]}<br>Your: ${ans[n]||'Not answered'} • Correct: ${q[1]}</div>`;});show('result');}
function restart(){start(currentTopic);}
</script>
</body>
</html>
