<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&display=swap');
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:#080b18;color:#fff}
.screen{display:none;min-height:100vh;padding:20px}.screen.active{display:flex!important;align-items:center;justify-content:center}
.wrap{width:min(1100px,96%);background:#ffffff0d;border:1px solid #ffffff1c;border-radius:30px;padding:38px;text-align:center}
.badge{display:inline-block;padding:8px 15px;border-radius:30px;background:#ffffff12;border:1px solid #ffffff20;color:#b8c4ff;font-size:12px;letter-spacing:2px;font-weight:800}
.college-title{font-family:"Playfair Display",serif;font-size:clamp(18px,2.8vw,30px);line-height:1.15;margin:18px auto 6px;font-weight:800;background:linear-gradient(90deg,#fff,#a9b7ff,#67e8f9);-webkit-background-clip:text;color:transparent}
.college-title span{display:block;font-size:.85em;letter-spacing:2px;margin-top:6px;background:linear-gradient(90deg,#a9b7ff,#67e8f9);-webkit-background-clip:text;color:transparent}
.main-title{font-family:"Playfair Display",serif;font-size:clamp(24px,4vw,38px);margin:14px 0 8px;background:linear-gradient(90deg,#fff,#a9b7ff,#67e8f9);-webkit-background-clip:text;color:transparent}
.lead{color:#aab3cc}.topics{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:30px 0}.topic{border:1px solid #ffffff1b;border-radius:24px;padding:30px 26px;text-align:left;background:linear-gradient(145deg,#ffffff12,#ffffff05);cursor:pointer;color:#fff;min-height:280px;display:flex;flex-direction:column;justify-content:space-between}
.tree-icon{font-size:72px}.count{padding:9px 14px;border-radius:20px;background:#ffffff10;color:#c8d1ff;font-size:12px;font-weight:700;display:inline-block;margin-top:18px}
.full{width:100%;padding:16px;border:0;border-radius:14px;background:linear-gradient(90deg,#5b4bff,#00b8d9);color:white;font-size:17px;font-weight:800;cursor:pointer}
input{width:100%;padding:15px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff0d;color:#fff;font-size:16px;margin-bottom:18px}
@media(max-width:700px){.topics{grid-template-columns:1fr 1fr;gap:14px}.college-title{font-size:13px}.tree-icon{font-size:58px}}
</style>
</head>
<body>

<div id="login" class="screen active">
<div class="wrap" style="max-width:650px">
<span class="badge">STUDENT LOGIN</span>
<h1 class="main-title" style="font-size:32px">Welcome to the Quiz</h1>
<p class="lead">Enter your details to start the Quiz</p>
<div style="text-align:left;margin-top:28px">
<label style="display:block;margin-bottom:8px;font-weight:700">Student Name</label>
<input id="studentName" placeholder="Enter your name">
<label style="display:block;margin-bottom:8px;font-weight:700">Register Number</label>
<input id="studentRoll" placeholder="Eg: 26PCA124">
<button class="full" id="continueBtn">Continue to Quiz →</button>
</div>
</div>
</div>

<div id="home" class="screen">
<div class="wrap">
<span class="badge">DEPARTMENT OF COMPUTER APPLICATIONS</span>
<div class="college-title">AYYA NADAR JANAKI AMMAL COLLEGE<span>(AUTONOMOUS), SIVAKASI</span></div>
<h1 class="main-title">Mathematical<br>Foundation</h1>
<p class="lead">The Grand Interactive Quiz Experience</p>
<div style="margin:20px auto;padding:18px;max-width:650px;border-radius:18px;background:#0003;border:1px solid #ffffff12"><b>DESIGNED BY</b><br>Sharmila M • 26PCA124<br>MCA • Advanced MCQ Practice</div>
<div class="topics">
<button class="topic" id="treesBtn"><div class="tree-icon">🌳</div><div><h2>Trees</h2><p style="color:#aeb7d0;font-size:14px">Analyze BSTs, AVL rotations, heaps</p></div><span class="count">20 QUESTIONS</span></button>
<button class="topic" id="boolBtn"><div style="width:56px;height:56px;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px"><div style="background:#6366f1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900">0</div><div style="background:#8b5cf6;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900">1</div><div style="background:#8b5cf6;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900">1</div><div style="background:#6366f1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900">0</div></div><div><h2>Boolean<br>Algebra</h2><p style="color:#aeb7d0;font-size:14px">Boolean identities, De Morgan, K-maps</p></div><span class="count">20 QUESTIONS</span></button>
</div>
<button class="full" id="grandBtn">🚀 START GRAND QUIZ • 40 QUESTIONS</button>
</div>
</div>

<!-- LOGIN SCRIPT THAN IYA - ERROR VARATHU -->
<script>
document.getElementById('continueBtn').addEventListener('click', function(){
  var n = document.getElementById('studentName').value.trim();
  var r = document.getElementById('studentRoll').value.trim();
  if(n==='' || r===''){ alert('Name & Roll No type pannu da!'); return; }
  document.getElementById('login').classList.remove('active');
  document.getElementById('home').classList.add('active');
  window.scrollTo(0,0);
});
</script>

<!-- QUIZ LOGIC -->
<div id="quiz" class="screen"><div class="wrap" style="width:min(950px,96%)"><div style="display:flex;justify-content:space-between"><span class="badge" id="topicName"></span><span class="badge" id="counter"></span></div><div style="height:9px;background:#ffffff10;border-radius:20px;margin:18px 0;overflow:hidden"><i id="bar" style="display:block;height:100%;width:0;background:linear-gradient(90deg,#6857ff,#4de4ff)"></i></div><div id="question" style="font-size:24px;margin:12px 0 24px;text-align:left"></div><div id="options" style="display:grid;gap:12px"></div><div style="display:flex;justify-content:space-between;margin-top:20px;gap:12px"><button class="full" style="background:#ffffff10" id="prevBtn">← Previous</button><button class="full" id="nextBtn">Next →</button></div></div></div>

<div id="result" class="screen"><div class="wrap" style="text-align:center"><h2 id="resTitle"></h2><div id="score" style="font-size:50px;font-weight:800"></div><p id="msg"></p><button class="full" onclick="location.reload()">⌂ Home</button><div id="review" style="text-align:left;margin-top:20px;max-height:300px;overflow:auto"></div></div></div>

<script>
let T=[["Full binary tree 15 internal vertices leaves?","16, 31","15, 31","16, 30","15, 30"],["Preorder A(B(E,F),C,D(G))?","A B E F C D G","E F B C G D A","A C B E F D G","A B C D E F G"],["Max children?","4","3","5","8"],["12 vertices 11 edges?","The graph is a tree","One cycle","Disconnected","Degree 2"],["Inorder predecessor of 40?","35","20","30","50"]];
let B=[["Simplify A + A'B.","A + B","A","B","AB"],["Simplify (A+B)(A+C).","A + BC","AB+AC","A(B+C)","A+B+C"],["Complement of AB+C?","(A' + B')C'","(A+B)C","A'B' + C'","AB + C'"],["Dual of A+0=A?","A·1=A","A+1=1","A·0=0","A+A=A"],["m5(A,B,C)?","AB'C","A'BC","ABC'","A'B'C"]];
let qs=[],ans=[],qi=0,cur='';
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function start(t){cur=t;qs=t==='Trees'?T:t==='Boolean Algebra'?B:[...T,...B];ans=Array(qs.length).fill(null);qi=0;show('quiz');render();}
function render(){document.getElementById('topicName').textContent=cur;document.getElementById('counter').textContent=(qi+1)+'/'+qs.length;document.getElementById('bar').style.width=((qi+1)/qs.length*100)+'%';document.getElementById('question').textContent=qs[qi][0];let o=document.getElementById('options');o.innerHTML='';qs[qi].slice(1).forEach((x,k)=>{let b=document.createElement('button');b.style.cssText='border:1px solid #ffffff18;background:#ffffff09;color:#eef2ff;border-radius:12px;padding:14px;text-align:left;cursor:pointer';if(ans[qi]===x)b.style.background='#5965ff33';b.textContent=String.fromCharCode(65+k)+'. '+x;b.onclick=()=>{ans[qi]=x;render();};o.appendChild(b);});}
function next(){if(!ans[qi]){alert('Select answer');return;}if(qi<qs.length-1){qi++;render();}else{finish();}}
function prev(){if(qi>0){qi--;render();}}
function finish(){let c=qs.filter((q,i)=>ans[i]===q[1]).length;document.getElementById('resTitle').textContent=cur;document.getElementById('score').textContent=c+' / '+qs.length;document.getElementById('msg').textContent='Good job!';show('result');}
document.getElementById('treesBtn').addEventListener('click',()=>start('Trees'));
document.getElementById('boolBtn').addEventListener('click',()=>start('Boolean Algebra'));
document.getElementById('grandBtn').addEventListener('click',()=>start('All'));
document.getElementById('nextBtn').addEventListener('click',next);
document.getElementById('prevBtn').addEventListener('click',prev);
</script>
</body>
</html>
