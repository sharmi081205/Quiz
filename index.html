<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz - Final 40</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Playfair+Display:wght@700&display=swap');
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:#080b18;color:#fff}
.screen{display:none;min-height:100vh;padding:20px}.screen.active{display:flex!important;align-items:center;justify-content:center}
.wrap{width:min(1100px,96%);background:#ffffff0d;border:1px solid #ffffff1c;border-radius:30px;padding:38px;text-align:center}
.badge{display:inline-block;padding:8px 15px;border-radius:30px;background:#ffffff12;border:1px solid #ffffff20;color:#b8c4ff;font-size:12px;letter-spacing:2px;font-weight:800}
.college-title{font-family:"Playfair Display",serif;font-size:clamp(16px,2.5vw,26px);line-height:1.15;margin:18px auto 6px;font-weight:800;background:linear-gradient(90deg,#fff,#a9b7ff,#67e8f9);-webkit-background-clip:text;color:transparent}
.college-title span{display:block;font-size:.85em;letter-spacing:2px;margin-top:6px;background:linear-gradient(90deg,#a9b7ff,#67e8f9);-webkit-background-clip:text;color:transparent}
.main-title{font-family:"Playfair Display",serif;font-size:clamp(24px,4vw,36px);margin:14px 0 8px;background:linear-gradient(90deg,#fff,#a9b7ff,#67e8f9);-webkit-background-clip:text;color:transparent}
.lead{color:#aab3cc}.topics{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:26px 0}
.topic{border:1px solid #ffffff1b;border-radius:20px;padding:22px 20px;text-align:left;background:linear-gradient(145deg,#ffffff12,#ffffff05);cursor:pointer;color:#fff;min-height:210px;display:flex;flex-direction:column;justify-content:space-between;width:100%;transition:.2s}
.topic:hover{transform:translateY(-4px);border-color:#8ea0ff88}
.tree-icon{font-size:56px}.count{padding:7px 12px;border-radius:20px;background:#ffffff10;color:#c8d1ff;font-size:11px;font-weight:700;display:inline-block;margin-top:12px}
.full{width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,#5b4bff,#00b8d9);color:white;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px}
input{width:100%;padding:13px;border-radius:10px;border:1px solid #ffffff22;background:#ffffff0d;color:#fff;font-size:15px;margin-bottom:14px}
</style>
</head>
<body>

<div id="login" class="screen active">
<div class="wrap" style="max-width:600px">
<span class="badge">STUDENT LOGIN</span>
<h1 class="main-title" style="font-size:28px">Welcome to the Quiz</h1>
<p class="lead">Enter your details to start the Quiz</p>
<div style="text-align:left;margin-top:22px">
<input id="studentName" placeholder="Enter your name">
<input id="studentRoll" placeholder="Eg: 26PCA124">
<button class="full" type="button" onclick="goToHome()">Continue to Quiz →</button>
</div>
</div>
</div>

<div id="home" class="screen">
<div class="wrap">
<span class="badge">DEPARTMENT OF COMPUTER APPLICATIONS</span>
<div class="college-title">AYYA NADAR JANAKI AMMAL COLLEGE<span>(AUTONOMOUS), SIVAKASI</span></div>
<h1 class="main-title">Mathematical<br>Foundation</h1>
<p class="lead">The Grand Interactive Quiz Experience</p>
<div style="margin:18px auto;padding:14px;max-width:600px;border-radius:14px;background:#0003;border:1px solid #ffffff12"><b>DESIGNED BY</b><br>Sharmila M • 26PCA124</div>
<div class="topics">
<button class="topic" type="button" onclick="startQuiz('Trees')"><div class="tree-icon">🌳</div><div><h2 style="margin:8px 0;font-size:19px">Trees</h2><p style="color:#aeb7d0;font-size:13px">BST, Traversals, Huffman, Nim</p></div><span class="count">20 QUESTIONS</span></button>
<button class="topic" type="button" onclick="startQuiz('Boolean Algebra')"><div style="font-size:32px;font-weight:900">0 1<br>1 0</div><div><h2 style="margin:8px 0;font-size:19px">Boolean<br>Algebra</h2><p style="color:#aeb7d0;font-size:13px">Identities, K-maps, Gates</p></div><span class="count">20 QUESTIONS</span></button>
</div>
<button class="full" type="button" onclick="startQuiz('All')">🚀 START GRAND QUIZ • 40 QUESTIONS</button>
</div>
</div>

<div id="quiz" class="screen"><div class="wrap" style="width:min(950px,96%)"><div style="display:flex;justify-content:space-between"><span class="badge" id="topicName"></span><span class="badge" id="counter"></span></div><div style="height:8px;background:#ffffff10;border-radius:20px;margin:16px 0"><div id="bar" style="height:100%;width:0;background:linear-gradient(90deg,#6857ff,#4de4ff)"></div></div><div id="question" style="font-size:22px;margin:10px 0 20px;text-align:left"></div><div id="options" style="display:grid;gap:10px"></div><div style="display:flex;gap:12px;margin-top:20px"><button class="full" style="background:#ffffff10" type="button" onclick="prevQ()">← Previous</button><button class="full" type="button" onclick="nextQ()">Next →</button></div></div></div>
<div id="result" class="screen"><div class="wrap"><h2 id="resTitle"></h2><div id="score" style="font-size:48px;font-weight:800"></div><p id="msg"></p>
<button class="full" type="button" onclick="goToMainPage()">⌂ Back to Main Page</button>
<div id="review" style="text-align:left;margin-top:20px;max-height:320px;overflow:auto"></div></div></div>

<script>
function goToHome(){var n=document.getElementById('studentName').value.trim();var r=document.getElementById('studentRoll').value.trim();if(!n||!r){alert('Name & Roll type pannu da!');return;}document.getElementById('login').classList.remove('active');document.getElementById('home').classList.add('active');}
function goToMainPage(){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('home').classList.add('active');}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

// NEW 40 QUESTIONS YOU GAVE
const TREES=[
["A tree contains 25 vertices. What is the total number of edges in the tree?","24","25","26","50"],
["A tree has 10 vertices. If one edge is added to it, what will necessarily happen?","The graph becomes disconnected.","The graph contains exactly one cycle.","The number of vertices increases.","The graph remains a tree."],
["A is root, A has children B and C, B has children D and E, C has child F. What is the postorder traversal?","A B D E C F","D E B F C A","D B E F C A","B D E C F A"],
["A rooted tree has a node at level 3. What is the length of the path from the root to that node?","2","3","4","1"],
["A full binary tree has 12 internal vertices. How many leaves does it contain?","12","13","24","11"],
["What is the maximum number of nodes at level 4 in a binary tree, assuming the root is at level 0?","8","16","15","32"],
["Insert 40,20,60,10,30,50,70. Which element becomes the inorder successor of 40?","20","30","50","60"],
["Which traversal of a BST produces the elements in ascending order?","Preorder","Postorder","Inorder","Level-order"],
["What is the average-case search complexity in a reasonably balanced BST containing n nodes?","O(n²)","O(log n)","O(n)","O(1)"],
["When deleting a leaf node from a BST, what operation is required?","Replace it with its inorder successor.","Replace it with its parent.","Remove the node directly.","Rotate the entire tree."],
["How many possible orderings exist for 4 distinct elements in sorting?","4","8","16","24"],
["What is the minimum number of comparisons required in worst case for 3 distinct elements?","2","3","4","6"],
["Three symbols frequencies A=5 B=7 C=10. What is total weighted path length of Huffman tree?","22","27","29","34"],
["In Huffman coding, which symbol generally receives the shortest codeword?","The least frequent symbol","The most frequent symbol","The first symbol alphabetically","All symbols receive equal-length codes"],
["Which of the following is a prefix-free code?","{0, 01, 11}","{1, 10, 110}","{00, 01, 10, 11}","{0, 1, 01}"],
["A full 3-ary tree has 7 internal vertices. How many leaves does it contain?","14","15","21","22"],
["In Nim, piles 2,3,1. What is Nim-sum?","0","1","2","3"],
["In normal-play Nim, position with Nim-sum zero indicates?","The current player has a guaranteed winning move.","The position is losing for the player whose turn it is, assuming optimal play.","All piles are equal.","The game has already ended."],
["Which traversal is used to evaluate postfix expression tree?","Inorder","Preorder","Postorder","Level-order"],
["A tree has 8 vertices. What is sum of degrees?","7","8","14","16"]
];
const BOOLEAN=[
["Simplify F=A+AB","A","B","A+B","AB"],
["Simplify F=A(A+B)","B","A","A+B","AB"],
["Find complement of F=A+B","A'+B'","A'B'","AB","A+B'"],
["Simplify F=(A+B)(A+B')","A","B","A+B","0"],
["Convert F(A,B,C)=A+B'C into canonical SOP","Σm(1,4,5,6,7)","Σm(2,3,4,5,6,7)","Σm(0,1,4,5,7)","Σm(1,2,3,4,6,7)"],
["If F=Σm(1,3,5,7) correct canonical POS?","ΠM(0,2,4,6)","ΠM(1,3,5,7)","ΠM(0,1,2,3)","ΠM(2,4,6,7)"],
["What is minterm m6(A,B,C)?","AB'C'","ABC'","A'BC","A'B'C"],
["What is maxterm M5(A,B,C)?","A+B'+C","A'+B+C'","A'+B'+C","A+B+C'"],
["What is dual of A+1=1?","A·0=0","A·1=1","A+0=0","A'+1=0"],
["How many input combinations for 3 variables?","3","6","8","9"],
["Which gates can be used alone to implement NOT, AND, OR?","XOR","NAND","AND","XNOR"],
["Which expression represents OR using only NAND?","A NAND B","(A NAND A) NAND (B NAND B)","(A NAND B) NAND (A NAND B)","A NAND (A NAND B)"],
["How many cells in 3-variable K-map?","4","6","8","16"],
["In 4-variable K-map group of 4 eliminates how many?","1","2","3","4"],
["Simplify F(A,B,C)=Σm(4,5,6,7)","A","B","C","A+B"],
["Don't-care represented by?","0","1","X","Z"],
["Main advantage of don't-care in K-map?","They increase number of variables.","They can help form larger groups and simplify.","They always increase circuit complexity.","They eliminate all input variables."],
["First step in Quine-McCluskey?","Draw circuit diagram.","Group minterms according to number of 1s.","Apply De Morgan's theorem.","Convert into POS form."],
["Simplify F=AB+AB'","A","B","AB","A+B"],
["Which is functionally complete gate?","XOR","XNOR","NOR","NOT only"]
];

let qs=[],ans=[],qi=0,cur='';
function startQuiz(t){
  cur=t;
  if(t==='Trees') qs=TREES;
  else if(t==='Boolean Algebra') qs=BOOLEAN;
  else qs=[...TREES,...BOOLEAN];
  ans=Array(qs.length).fill(null); qi=0;
  showScreen('quiz'); render();
}
function render(){
  document.getElementById('topicName').textContent=cur+' - '+qs.length+' Q';
  document.getElementById('counter').textContent=(qi+1)+'/'+qs.length;
  document.getElementById('bar').style.width=((qi+1)/qs.length*100)+'%';
  document.getElementById('question').textContent=(qi+1)+'. '+qs[qi][0];
  let o=document.getElementById('options'); o.innerHTML='';
  qs[qi].slice(1).forEach((x,k)=>{
    let b=document.createElement('button');
    b.style.cssText='border:1px solid #ffffff18;background:#ffffff09;color:#eef2ff;border-radius:10px;padding:12px;text-align:left;cursor:pointer;font-size:15px';
    if(ans[qi]===x) b.style.background='#5965ff55';
    b.textContent=String.fromCharCode(65+k)+'. '+x;
    b.onclick=function(){ans[qi]=x; render();};
    o.appendChild(b);
  });
}
function nextQ(){ if(!ans[qi]){alert('Answer select pannu da!');return;} if(qi<qs.length-1){qi++;render();} else finishQ(); }
function prevQ(){ if(qi>0){qi--;render();} }
function finishQ(){
  let c=qs.filter((q,i)=>ans[i]===q[1]).length;
  document.getElementById('resTitle').textContent=cur+' Completed';
  document.getElementById('score').textContent=c+' / '+qs.length+' ('+Math.round(c/qs.length*100)+'%)';
  document.getElementById('msg').textContent=c>=qs.length*0.8?'Outstanding!':c>=qs.length*0.5?'Good Job!':'Keep Practising!';
  let r=document.getElementById('review'); r.innerHTML='<b>Review</b>';
  qs.forEach((q,i)=>{ r.innerHTML+='<div style="padding:8px;border-bottom:1px solid #ffffff12">Q'+(i+1)+': '+q[0]+'<br>Your: '+(ans[i]||'Not answered')+' | Correct: '+q[1]+'</div>'; });
  showScreen('result');
}
</script>
</body>
</html>
