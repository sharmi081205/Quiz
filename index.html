<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mathematical Foundation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap');
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:#080b18;color:#fff}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 15% 20%,#5546ff55,transparent 28%),radial-gradient(circle at 85% 75%,#00d4ff33,transparent 30%);z-index:-2}
.screen{display:none;min-height:100vh;padding:20px}.screen.active{display:flex!important;align-items:center;justify-content:center}
.wrap{width:min(1100px,96%);background:#ffffff0d;border:1px solid #ffffff1c;border-radius:30px;backdrop-filter:blur(16px);padding:32px;text-align:center}
.badge{display:inline-block;padding:7px 14px;border-radius:30px;background:#ffffff12;border:1px solid #ffffff20;color:#b8c4ff;font-size:11px;letter-spacing:2px;font-weight:800}
.college-title{font-family:"Playfair Display",serif;font-size:clamp(13px,1.8vw,21px);white-space:nowrap;line-height:1.2;margin:16px auto 6px;font-weight:800;background:linear-gradient(90deg,#fff,#a9b7ff,#67e8f9);-webkit-background-clip:text;color:transparent}
.main-title{font-family:"Playfair Display",serif;font-size:clamp(22px,4vw,32px);margin:12px 0 6px;background:linear-gradient(90deg,#fff,#a9b7ff,#67e8f9);-webkit-background-clip:text;color:transparent}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0}
.topic{border:1px solid #ffffff1b;border-radius:18px;padding:18px;text-align:left;background:#ffffff0d;cursor:pointer;color:#fff;min-height:190px;display:flex;flex-direction:column;justify-content:space-between;width:100%}
.topic:hover{transform:translateY(-3px);border-color:#8ea0ff88}
.full{width:100%;padding:12px;border:0;border-radius:12px;background:linear-gradient(90deg,#5b4bff,#00b8d9);color:white;font-weight:800;cursor:pointer;margin-top:10px}
.score-circle{width:110px;height:110px;border-radius:50%;background:conic-gradient(#5b4bff 0% var(--pct), #ffffff12 var(--pct) 100%);display:flex;align-items:center;justify-content:center;margin:16px auto}
.score-circle span{width:88px;height:88px;background:#0f1226;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.stat{padding:12px;border-radius:12px;background:#ffffff08;border:1px solid #ffffff12}
.review-item{padding:10px;border-radius:10px;background:#ffffff06;border:1px solid #ffffff10;margin-bottom:8px;text-align:left;font-size:13px;line-height:1.4}
@media(max-width:700px){.college-title{font-size:11px;white-space:normal}}
</style>
</head>
<body>

<!-- DIRECT HOME - NO LOGIN -->
<div id="home" class="screen active">
<div class="wrap">
<span class="badge">DEPARTMENT OF COMPUTER APPLICATIONS</span>
<div class="college-title">AYYA NADAR JANAKI AMMAL COLLEGE (AUTONOMOUS), SIVAKASI</div>
<h1 class="main-title">Mathematical<br>Foundation</h1>
<div style="margin:12px auto;padding:10px;max-width:560px;border-radius:12px;background:#0003;border:1px solid #ffffff12;font-size:12px"><b>DESIGNED BY</b><br>Sharmila M • 26PCA124 • MCA</div>
<div class="topics">
<button class="topic" type="button" onclick="startQuiz('Trees')"><div style="font-size:44px">🌳</div><div><h2 style="font-size:16px;margin:6px 0">Trees</h2><p style="color:#aeb7d0;font-size:11px">Rooted, BST, Decision, Huffman</p></div><span style="font-size:10px;background:#ffffff10;padding:6px 10px;border-radius:20px">20 QUESTIONS</span></button>
<button class="topic" type="button" onclick="startQuiz('Boolean Algebra')"><div style="font-size:26px;font-weight:900">0 1<br>1 0</div><div><h2 style="font-size:16px;margin:6px 0">Boolean Algebra</h2><p style="color:#aeb7d0;font-size:11px">SOP, POS, K-map, Quine</p></div><span style="font-size:10px;background:#ffffff10;padding:6px 10px;border-radius:20px">20 QUESTIONS</span></button>
</div>
<button class="full" type="button" onclick="startQuiz('All')">🚀 START GRAND QUIZ • 40 QUESTIONS</button>
</div>
</div>

<div id="quiz" class="screen"><div class="wrap" style="width:min(950px,96%)"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><span class="badge" id="topicName"></span><span class="badge" id="counter"></span></div><div style="height:8px;background:#ffffff10;border-radius:20px;margin:14px 0"><div id="bar" style="height:100%;width:0;background:linear-gradient(90deg,#6857ff,#4de4ff)"></div></div><div id="question" style="font-size:18px;margin:10px 0 18px;text-align:left;line-height:1.5"></div><div id="options" style="display:grid;gap:10px"></div><div style="display:flex;gap:10px;margin-top:18px"><button class="full" style="background:#ffffff10" type="button" onclick="prevQ()">← Previous</button><button class="full" type="button" onclick="nextQ()">Next →</button></div></div></div>

<div id="result" class="screen"><div class="wrap" style="max-width:740px">
<span class="badge">QUIZ COMPLETED</span><h2 id="resTitle"></h2>
<div class="score-circle" id="circle"><span id="scoreText"></span></div>
<p id="msg" style="color:#aab3cc"></p>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0">
<div class="stat"><b id="statCorrect" style="font-size:18px"></b><br><span style="font-size:11px;color:#aab3cc">Correct</span></div>
<div class="stat"><b id="statWrong" style="font-size:18px"></b><br><span style="font-size:11px;color:#aab3cc">Wrong</span></div>
<div class="stat"><b id="statPct" style="font-size:18px"></b><br><span style="font-size:11px;color:#aab3cc">Score</span></div>
</div>
<button class="full" type="button" onclick="goToMainPage()">← Back</button>
<div id="review" style="margin-top:18px;max-height:380px;overflow:auto"></div>
</div></div>

<script>
function goToMainPage(){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('home').classList.add('active');}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

const TREES=[
["A rooted tree has 1 root, 3 vertices at level 1, and 6 vertices at level 2. If every vertex at level 1 has at least one child, which of the following is necessarily true?","Every vertex has exactly two children.","The tree has 10 vertices.","The tree must be a binary tree.","The tree has exactly 3 leaves."],
["An ordered rooted tree has a root with three children A, B and C. The subtrees rooted at A, B and C contain 2, 3 and 4 vertices, respectively. How many vertices are present in the entire tree?","9","10","11","12"],
["A full m-ary tree has 21 vertices and 7 internal vertices. What is the value of m?","2","3","4","5"],
["A saturated homogeneous binary tree has height 4, with the root at level 0. What is the total number of vertices?","15","16","31","32"],
["In a rooted tree, a vertex has degree 4 and is not the root. How many children does it have?","4","3","5","Cannot be determined"],
["An organization has a CEO, 4 department heads, and each department head supervises 3 managers. If the structure is represented as a rooted tree, how many vertices are present, excluding employees below the managers?","12","15","17","20"],
["A computer file system is represented by a rooted tree. If a directory contains 5 subdirectories and 8 files directly inside it, what is its total number of immediate children?","5","8","13","40"],
["A tree is used to represent the interconnection of processors in a parallel computing system. If the tree contains 16 processors, how many communication links are required to connect all processors without cycles?","14","15","16","17"],
["Which property of a tree makes it suitable for representing hierarchical organizational structures?","Every vertex has the same degree.","There is a unique path between any two vertices.","Every vertex belongs to a cycle.","The graph must be complete."],
["A connected graph has 18 vertices and 17 edges. Which conclusion can be drawn?","It must contain a cycle.","It must be a tree.","It must be a complete graph.","It must be disconnected."],
["A tree has 8 leaves. What is the minimum possible number of vertices of degree 3?","0","1","2","4"],
["Consider the following binary search tree: Root = 40 Left child = 20 Right child = 60 20 has children 10 and 30. 60 has children 50 and 70. What is the sum of the keys obtained through an inorder traversal?","180","270","280","300"],
["A binary search tree contains 7 nodes and has the minimum possible height. Assuming the root is at height 0, what is its height?","1","2","3","4"],
["A comparison-based sorting algorithm must distinguish between all permutations of 4 distinct elements. What is the minimum height of its worst-case decision tree?","3","4","5","6"],
["A comparison-based sorting decision tree has height h for sorting n distinct elements. Which mathematical condition must hold?","2^h ≥ n!","h ≥ 2^n","2^n ≥ h!","h=n!"],
["What is the minimum number of comparisons required in the worst case to sort 5 distinct elements using a comparison-based sorting algorithm?","5","6","7","10"],
["Which of the following sets of binary codewords is prefix-free?","{0, 01, 11}","{10, 100, 11}","{00, 01, 10, 11}","{1, 10, 110}"],
["Three symbols have frequencies 5, 7 and 10. What is the minimum weighted path length of their binary Huffman tree?","22","34","39","44"],
["In a normal-play Nim game, the pile sizes are (3, 4, 7). What is the Nim-sum?","0","2","4","7"],
["In a Tic-Tac-Toe game tree, what does a leaf node represent?","A possible first move","An intermediate game position","A terminal game position with a result","A player's turn only"]
];
const BOOLEAN=[
["A Boolean function of 4 variables has how many possible input combinations?","4","8","16","32"],
["Simplify the Boolean expression: F=A+AB","A","B","AB","A+B"],
["Simplify: F=(A+B)(A+B')","A","B","A+B","0"],
["Which of the following is the correct form of the absorption law?","A+AB=A","A+AB=B","A(A+B)=B","A+A'=A"],
["What is the dual of the Boolean expression? A+0=A","A·1=A","A+1=1","A·0=0","A'+0=A"],
["If a Boolean identity is true, what can be said about its dual according to the principle of duality?","The dual is always false.","The dual is also a valid Boolean identity.","The dual must contain more variables.","The dual is always equal to zero."],
["Which of the following is in canonical Sum of Products (SOP) form?","AB+BC","A'BC+AB'C+ABC","(A+B)(B+C)","A(B+C)"],
["Which of the following is in canonical Product of Sums (POS) form for three variables?","AB+AC","(A+B+C)(A+B'+C)(A'+B+C')","A(B+C)","AB'C+A'BC"],
["Convert the following Boolean function into canonical SOP form: F(A,B,C)=A+B'C","Σm(1,4,5,6,7)","Σm(0,1,2,3)","Σm(2,3,4,5)","Σm(1,2,3,7)"],
["If: F(A,B,C)=Σm(1,3,5,7) What is the simplified expression?","A","B","C","A+B"],
["Which of the following gates is functionally complete by itself?","XOR","AND","NAND","XNOR"],
["Which expression represents the NOT operation using only a NAND gate?","A NAND 0","A NAND A","A NAND 1","A+A"],
["Simplify the Boolean expression: F=AB+A'C+BC","AB+A'C","AB+BC","A'C+BC","A+B+C"],
["How many cells are present in a 4-variable Karnaugh map?","4","8","16","32"],
["In a 4-variable K-map, a group of 4 adjacent 1s eliminates how many variables?","1","2","3","4"],
["In a 4-variable K-map, which grouping generally produces the simplest product term?","A group of 2 cells","A group of 4 cells","A group of 8 cells","A single cell"],
["Simplify the following Boolean function: F(A,B,C)=Σm(4,5,6,7)","A","B","C","A+B"],
["In Boolean function minimization, a don't-care condition is commonly represented by:","0","1","X","Z"],
["A Boolean function is given by: F=Σm(1,3,7)+d(5) How can the don't-care term be used during K-map minimization?","It must always be treated as 0.","It must always be treated as 1.","It can be treated as 0 or 1 to simplify the function.","It must be ignored in every situation."],
["What is the first step in the Quine–McCluskey minimization method?","Draw the logic circuit.","Group minterms according to the number of 1s in their binary representations.","Apply De Morgan's theorem.","Convert the function into POS form."]
];

let qs=[],ans=[],qi=0,cur='';
function startQuiz(t){cur=t;if(t==='Trees')qs=TREES;else if(t==='Boolean Algebra')qs=BOOLEAN;else qs=[...TREES,...BOOLEAN];ans=Array(qs.length).fill(null);qi=0;showScreen('quiz');render();}
function render(){
  document.getElementById('topicName').textContent=cur+' - '+qs.length+' Q';
  document.getElementById('counter').textContent=(qi+1)+'/'+qs.length;
  document.getElementById('bar').style.width=((qi+1)/qs.length*100)+'%';
  document.getElementById('question').textContent=(qi+1)+'. '+qs[qi][0];
  let o=document.getElementById('options');o.innerHTML='';
  qs[qi].slice(1).forEach((x,k)=>{
    let b=document.createElement('button');
    b.style.cssText='border:1px solid #ffffff18;background:#ffffff09;color:#eef2ff;border-radius:10px;padding:12px;text-align:left;cursor:pointer;font-size:14px;line-height:1.4';
    if(ans[qi]===x)b.style.background='#5965ff55';
    b.textContent=String.fromCharCode(65+k)+'. '+x;
    b.onclick=()=>{ans[qi]=x;render();};
    o.appendChild(b);
  });
}
function nextQ(){if(!ans[qi]){alert('Answer select pannu!');return;}if(qi<qs.length-1){qi++;render();}else finishQ();}
function prevQ(){if(qi>0){qi--;render();}}
function finishQ(){
  let c=qs.filter((q,i)=>ans[i]===q[1]).length;let w=qs.length-c;let pct=Math.round(c/qs.length*100);
  document.getElementById('resTitle').textContent=cur+' Completed';
  document.getElementById('circle').style.setProperty('--pct',pct+'%');
  document.getElementById('scoreText').textContent=c+'/'+qs.length;
  document.getElementById('statCorrect').textContent=c;
  document.getElementById('statWrong').textContent=w;
  document.getElementById('statPct').textContent=pct+'%';
  document.getElementById('msg').textContent=pct>=80?'Outstanding! 🌟':pct>=60?'Great Job! 🎉':'Keep Practising! 💪';
  let r=document.getElementById('review');r.innerHTML='<b style="color:#aab3cc">Detailed Review</b>';
  qs.forEach((q,i)=>{
    let ok=ans[i]===q[1];
    r.innerHTML+='<div class="review-item"><b>Q'+(i+1)+':</b> '+q[0]+'<br>Your: <span style="color:'+(ok?'#4ade80':'#f87171')+'">'+(ans[i]||'Not answered')+'</span> | Correct: <span style="color:#4ade80">'+q[1]+'</span> '+(ok?'✅':'❌')+'</div>';
  });
  showScreen('result');
}
</script>
</body>
</html>
